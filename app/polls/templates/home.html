{% extends "base.html" %}

{% block title %}Login{% endblock %}
{% block heading %}Login to your account{% endblock %}

{% block content %}
{% if messages %}
<div class="mb-5">
    {% for message in messages %}
    <p class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl p-3">{{ message }}</p>
    {% endfor %}
</div>
{% endif %}

<form action="{% url 'login_submit' %}" method="post" class="space-y-5">
    {% csrf_token %}

    <div>
        <label class="block text-sm font-semibold text-forest-700 mb-2">Username</label>
        <input type="text" name="username" placeholder="Enter your username" autocomplete="username"
            class="w-full px-4 py-3 rounded-xl border-2 border-forest-100 bg-forest-50 text-forest-800 placeholder-slate2-300 transition-all" required>
    </div>

    <div>
        <label class="block text-sm font-semibold text-forest-700 mb-2">Password</label>
        <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password"
            class="w-full px-4 py-3 rounded-xl border-2 border-forest-100 bg-forest-50 text-forest-800 placeholder-slate2-300 transition-all" required>
    </div>

    <button type="submit"
        class="btn-primary w-full py-3.5 rounded-xl text-white font-semibold text-base mt-2" style="background: linear-gradient(135deg, #1e4522, #3d8f3e);">
        Log in
    </button>
</form>

<p class="text-center text-sm text-slate2-500 mt-5">
    Don't have an account?
    <a href="{% url 'signup' %}" class="text-forest-500 font-semibold hover:text-forest-600 hover:underline">
        Sign up
    </a>
</p>
{% endblock %}
